# Render blueprint for the hosted demo.
#
# One service, no database. The backend runs on in-memory H2 with seed data
# (see application-demo.yml for why), so there is nothing to provision and
# nothing that expires.
#
# The free instance sleeps after about fifteen minutes idle, so the first
# request after a quiet period waits for a cold start. The login screen says so
# rather than leaving a visitor looking at a spinner.
services:
  - type: web
    name: loan-tracker-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile.demo
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      # Generated by Render and never stored in the repository. The application
      # refuses to start without them, which is the behaviour that matters.
      - key: JWT_SECRET
        generateValue: true
      - key: NID_PEPPER
        generateValue: true
      - key: CORS_ORIGINS
        sync: false        # set to the deployed frontend's origin
      - key: SPRING_PROFILES_ACTIVE
        value: demo
