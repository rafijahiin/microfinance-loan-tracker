name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

# A second push to the same branch cancels the first. Without this, a busy
# branch queues builds that are already obsolete before they start.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The suite runs against in-memory H2 and needs no services, which is why
      # there is no postgres container here. The Flyway migrations are checked
      # a different way: MigrationMatchesEntitiesTest replays them and asserts
      # they still match the entity mappings.
      - name: Test
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  backend-postgres:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest

    # The same 84 tests as the job above, run against a real PostgreSQL with
    # the real Flyway migrations and ddl-auto=validate.
    #
    # This job exists because H2 is a liar by omission. The borrower search
    # passed on H2 while being broken on PostgreSQL: a null bind parameter
    # arrives untyped, PostgreSQL guesses bytea inside lower(), and the members
    # list returned 500. A smoke test deleting partners out of foreign-key
    # order passed there too. Neither is visible without the real engine.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loantracker_test
          POSTGRES_USER: loantracker
          POSTGRES_PASSWORD: loantracker
        ports:
          - 5432:5432
        # Without the health check the job races the database and fails on a
        # connection refused that looks like a test failure.
        options: >-
          --health-cmd "pg_isready -U loantracker -d loantracker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test against PostgreSQL
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/loantracker_test
          TEST_DB_DRIVER: org.postgresql.Driver
          TEST_DB_USER: loantracker
          TEST_DB_PASSWORD: loantracker
          # validate, not create-drop: the migrations themselves are what is
          # under test here, not a schema Hibernate invented.
          TEST_DDL_AUTO: validate
          TEST_FLYWAY: "true"
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly what the lockfile pins
      # and fails if the two disagree. `npm install` would quietly resolve new
      # versions, so CI would stop testing what a developer actually gets.
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds both images without starting them. This is what catches a
      # Dockerfile that no longer matches the source tree, which is otherwise
      # only discovered by whoever next runs docker compose.
      - name: Build backend image
        run: docker build -t loan-tracker-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t loan-tracker-frontend:ci ./frontend
