name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

# A second push to the same branch cancels the first. Without this, a busy
# branch queues builds that are already obsolete before they start.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The suite runs against in-memory H2 and needs no services, which is why
      # there is no postgres container here. The Flyway migrations are checked
      # a different way: MigrationMatchesEntitiesTest replays them and asserts
      # they still match the entity mappings.
      - name: Test
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly what the lockfile pins
      # and fails if the two disagree. `npm install` would quietly resolve new
      # versions, so CI would stop testing what a developer actually gets.
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds both images without starting them. This is what catches a
      # Dockerfile that no longer matches the source tree, which is otherwise
      # only discovered by whoever next runs docker compose.
      - name: Build backend image
        run: docker build -t loan-tracker-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t loan-tracker-frontend:ci ./frontend
