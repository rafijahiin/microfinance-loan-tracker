server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: any path that is not a real file is handed to index.html
    # so the client router can resolve it. Without this, reloading the browser
    # on /loans/7 returns a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is proxied through the same origin, so the browser never makes a
    # cross-origin request and CORS is not involved in the deployed setup.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames change whenever their content changes, so they can
    # be cached indefinitely. index.html must never be, or a browser keeps
    # loading the previous release's asset names after a deploy.
    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
