# Tests run against in-memory H2 rather than PostgreSQL.
#
# The trade-off is deliberate and worth stating. Testcontainers against the real
# PostgreSQL image would also exercise the Flyway migrations and catch dialect
# differences, and is the better answer where Docker is available on the build
# agent. H2 was chosen here so that `mvn test` passes on a clean checkout with
# nothing installed but a JDK, which is what a reviewer is most likely to have.
#
# Consequence to be honest about: the migrations in db/migration are exercised
# when the stack comes up under docker compose, not by this suite. The schema
# the tests run against is generated by Hibernate from the entity mappings.
# Every value below has an H2 default and an environment override, so the SAME
# suite runs twice: on H2 locally and in the first CI job, and against a real
# PostgreSQL with the real Flyway migrations in the second.
#
# That second run is not ceremony. The borrower search passed on H2 for days
# while being broken on PostgreSQL: a null bind parameter arrives untyped, and
# inside lower() PostgreSQL guesses bytea, so the members list 500'd. H2 has no
# such rule and reported nothing. Only running the tests against the real
# engine catches that class of defect.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:loantracker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${TEST_DB_DRIVER:org.h2.Driver}
    username: ${TEST_DB_USER:sa}
    password: ${TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      # On PostgreSQL this becomes `validate`, so the migrations themselves are
      # under test rather than a schema Hibernate invented.
      ddl-auto: ${TEST_DDL_AUTO:create-drop}
    open-in-view: false
  flyway:
    enabled: ${TEST_FLYWAY:false}

app:
  jwt:
    secret: test-only-signing-key-not-used-anywhere-real-0123456789
    expiry-minutes: 60
  nid:
    pepper: test-only-pepper-not-used-anywhere-real
  cors:
    allowed-origins: http://localhost:5173
  seed-demo-data: false

logging:
  level:
    root: WARN
    io.github.rafijahiin.loantracker: INFO
