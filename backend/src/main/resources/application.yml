spring:
  application:
    name: loan-tracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loantracker}
    username: ${DB_USER:loantracker}
    password: ${DB_PASSWORD:loantracker}

  jpa:
    hibernate:
      # validate, never update. Letting Hibernate alter a schema holding
      # financial records means the shape of the database is decided by
      # whichever version of the code booted last. Flyway owns the schema;
      # this setting makes the application refuse to start if the two have
      # drifted apart, which is the moment you want to find out.
      ddl-auto: validate
    # Off deliberately. Left on, the persistence session stays open for the
    # whole request, so a lazy association touched during JSON serialisation
    # quietly issues another query and an N+1 never shows up as an error. Off,
    # it throws, and the repository is fixed to fetch what it needs.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # No default. A fallback secret committed to the repository is how a
    # service ends up signing production tokens with a key anyone can read.
    secret: ${JWT_SECRET:}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:120}
  nid:
    # Same discipline as the signing key: no default. A committed pepper is a
    # published pepper, and every national ID hash computed under it becomes
    # enumerable again.
    pepper: ${NID_PEPPER:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed-demo-data: ${SEED_DEMO_DATA:false}

logging:
  level:
    io.github.rafijahiin.loantracker: ${LOG_LEVEL:INFO}
